<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --bg: #eef1f6; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
      --accent: #3b5bdb; --accent-dark: #2f49b3; --border: #d5dae3;
      --ok-bg: #e8f5ec; --ok-text: #1b6b3a; --err-bg: #fdecec; --err-text: #a12626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card);
      border-radius: 16px; padding: 28px;
      box-shadow: 0 10px 30px rgba(29, 36, 51, 0.12);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 6px; }
    input, select {
      width: 100%; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: #fff; color: var(--text);
    }
    input:disabled { background: #f2f4f8; color: var(--muted); }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem;
      font-weight: 600; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    button:hover { background: var(--accent-dark); }
    .box { margin-top: 20px; padding: 14px; border-radius: 8px; }
    .result { background: var(--ok-bg); color: var(--ok-text); }
    .result output { display: block; font-size: 1.8rem; font-weight: 700; word-break: break-all; }
    .error { background: var(--err-bg); color: var(--err-text); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Calculator</h1>
    <p class="subtitle">Pick an operation, enter your numbers, press Calculate.</p>

    <form method="post" action="/">
      <label for="operation">Operation</label>
      <select id="operation" name="operation">
        {% for key, label in operations.items() %}
        <option value="{{ key }}" {% if key == form.operation %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>

      <label for="first">First number (x)</label>
      <input id="first" name="first" type="number" step="any" required value="{{ form.first }}">

      <label for="second">Second number (y)</label>
      <input id="second" name="second" type="number" step="any" required value="{{ form.second }}">

      <button type="submit">Calculate</button>
    </form>

    {% if result is not none %}
    <div class="box result">Result<output id="result">{{ result }}</output></div>
    {% endif %}
    {% if error %}
    <div class="box error" id="error">{{ error }}</div>
    {% endif %}
  </main>

  <script>
    // Grey out the second box for one-number operations (sqrt, factorial).
    const unaryOperations = {{ unary_operations | tojson }};
    const operationSelect = document.getElementById("operation");
    const secondInput = document.getElementById("second");
    function updateSecondInput() {
      const isUnary = unaryOperations.includes(operationSelect.value);
      secondInput.disabled = isUnary;
      secondInput.required = !isUnary;
    }
    operationSelect.addEventListener("change", updateSecondInput);
    updateSecondInput();
  </script>
</body>
</html>
